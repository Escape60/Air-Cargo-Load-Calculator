<!DOCTYPE html>
<html>
  <head>
    <title>Air Cargo Load Calculator</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
      <main class="container">
        <h1 id="title">Flight Weight</h1>

      <!-- Inputs -->
      <section class="input-section">
        <div class="input-group">
          <label for="emptyWeight"> Empty Weight </label>

          <input
            type="text"
            id="emptyWeight"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="Enter Empty Weight"
          />
        </div>

        <div class="input-group">
          <label for="frontSeatWeight"> Front Seat 1 & 2 Weight </label>

          <input
            type="text"
            id="frontSeatWeight"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="Enter Passenger Weight"
          />
        </div>

        <div class="input-group">
          <label for="fuelWeight"> Fuel Weight </label>

          <input
            type="text"
            id="fuelWeight"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="Enter Fuel Weight"
          />
        </div>

         <div class="input-group">
          <label for="cargoWeight"> Cargo Weight </label>

          <input
            type="text"
            id="cargoWeight"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="Enter Cargo Weight"
          />
        </div>
      </section>
        <section class="gross-weight-container">
        <p>Total Flight Power</p>
        <h2 id="grossWeight">0</h2>
        <span>kg/m</span>
      </section>
 </main>
    <script src="./script.js" type="module"></script>
  </body>
</html>
